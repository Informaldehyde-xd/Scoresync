<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      overflow: hidden;
    }
    #osmd-container {
      white-space: nowrap;
      position: relative;
      transition: transform 0.15s linear;
    }
  </style>
  <script src="opensheetmusicdisplay.min.js"></script>
</head>
<body>
  <div id="osmd-container"></div>

  <script>
    const musicXml = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">
<score-partwise version="3.1">
  <part-list>
    <score-part id="P1">
      <part-name>Piano</part-name>
    </score-part>
  </part-list>
  <part id="P1">
    <measure number="1">
      <attributes>
        <divisions>1</divisions>
        <key><fifths>0</fifths></key>
        <time><beats>4</beats><beat-type>4</beat-type></time>
        <clef><sign>G</sign><line>2</line></clef>
      </attributes>
      <note><pitch><step>C</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>
      <note><pitch><step>D</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>
      <note><pitch><step>E</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>
      <note><pitch><step>F</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>
    </measure>
    <measure number="2">
      <note><pitch><step>G</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>
      <note><pitch><step>A</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>
      <note><pitch><step>B</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>
      <note><pitch><step>C</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
    </measure>
  </part>
</score-partwise>`;

    async function loadMusicXml(xmlString) {
      if (!window.osmd) return;
      await window.osmd.load(xmlString);
      window.osmd.render();
      window.osmd.cursor.show();
      window.osmd.cursor.cursorElement.style.transition = "left 0.12s linear, top 0.12s linear";
      const container = document.getElementById('osmd-container');
      container.style.transform = "translateX(0px)";
      console.log("new score loaded");
    }

    async function loadScore() {
      const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd-container", {
        autoResize: false,
        backend: "svg",
        drawTitle: true,
        renderSingleHorizontalStaffline: true,
        followCursor: false,
        cursorsOptions: [{ type: 0, color: "#33e02f", alpha: 0.5, follow: false }]
      });

      await osmd.load(musicXml);
      osmd.render();

      osmd.cursor.show();
      osmd.cursor.cursorElement.style.transition = "left 0.12s linear, top 0.12s linear";
      window.osmd = osmd;
    }

    function resetCursor() {
      if (window.osmd) {
        window.osmd.cursor.reset();
        window.osmd.cursor.show();
        const container = document.getElementById('osmd-container');
        container.style.transform = "translateX(0px)";
      }
    }

    function scrollToCursor() {
      if (!window.osmd || !window.osmd.cursor || !window.osmd.cursor.cursorElement) return;
      const rect = window.osmd.cursor.cursorElement.getBoundingClientRect();
      const container = document.getElementById('osmd-container');
      const currentMatch = container.style.transform.match(/-?\d+(\.\d+)?/);
      const currentX = currentMatch ? parseFloat(currentMatch[0]) : 0;
      const targetX = currentX - (rect.left - window.innerWidth / 2 + rect.width / 2);
      container.style.transform = `translateX(${Math.min(0, targetX)}px)`;
    }

    function cursorNext() {
      if (window.osmd) {
        window.osmd.cursor.next();
        scrollToCursor();
      }
    }

    function showCursorEl() {
      if (window.osmd && window.osmd.cursor) {
        window.osmd.cursor.show();
      }
    }

    function hideCursorEl() {
      if (window.osmd && window.osmd.cursor) {
        window.osmd.cursor.hide();
      }
    }

    loadScore();
  </script>
</body>
</html>
